name: Publish package page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build local Ryvax package
        run: npm ci --no-audit --no-fund && npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Enable GitHub Pages once in repository Settings → Pages.
          # Keeping creation outside Actions avoids requiring repository-admin API access.
          enablement: false
      - name: Export Ryvax Docs template
        working-directory: templates/docs-platform
        run: |
          npm install --no-audit --no-fund
          PUBLIC_BASE_PATH=/ryvax.js/template npm run export -- --out-dir dist
      - name: Add template to package site
        run: |
          rm -rf site/template
          mkdir -p site/template
          cp -R templates/docs-platform/dist/. site/template/
      - name: Export API Docs template
        working-directory: templates/api-docs
        run: |
          npm install --no-audit --no-fund
          PUBLIC_BASE_PATH=/ryvax.js/api-docs npm run export -- --out-dir dist
      - name: Add API Docs template to package site
        run: |
          rm -rf site/api-docs
          mkdir -p site/api-docs
          cp -R templates/api-docs/dist/. site/api-docs/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
