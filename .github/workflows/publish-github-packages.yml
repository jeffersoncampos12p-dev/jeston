name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish npm package to GitHub Packages
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          cache: npm

      - name: Configure GitHub Packages scope
        run: echo "@kvantjs:registry=https://npm.pkg.github.com" >> "$GITHUB_WORKSPACE/.npmrc"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate package
        run: npm run release:check

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --tag latest --registry=https://npm.pkg.github.com
