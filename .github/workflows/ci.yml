name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - name: Verify package contents
        shell: bash
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/ryvax-pack.json"
          node --input-type=module -e "import fs from 'node:fs'; const [pack] = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/ryvax-pack.json', 'utf8')); const files = new Set(pack.files.map(({path}) => path)); for (const required of ['dist/src/index.js', 'dist/src/index.d.ts', 'bin/ryvax.mjs', 'README.md', 'LICENSE']) { if (!files.has(required)) throw new Error('Missing package file: ' + required); }"
      - name: Package smoke import
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ryvax-smoke"
          TARBALL="$(npm pack --pack-destination "$RUNNER_TEMP/ryvax-smoke" --silent)"
          mkdir -p "$RUNNER_TEMP/ryvax-consumer"
          cd "$RUNNER_TEMP/ryvax-consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts "$RUNNER_TEMP/ryvax-smoke/$TARBALL" react react-dom >/dev/null
          node --input-type=module -e "const pkg = await import('@kvantjs/ryvax.js'); if (typeof pkg.createAppServer !== 'function' || typeof pkg.createHealthRegistry !== 'function') process.exit(1);"
      - run: npm audit --audit-level=high
      - name: Generate SBOM
        run: npm run sbom > "$RUNNER_TEMP/ryvax-sbom.json"
